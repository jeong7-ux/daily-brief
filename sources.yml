# 수집 대상 정의. 여기만 고치면 워크플로 수정 없이 소스를 바꿀 수 있습니다.

settings:
  # 몇 시간 이내에 올라온 항목까지 수집할지.
  # 12시간마다 실행하므로 12 + 여유 2 = 14. 크론이 밀려도 구멍이 안 생깁니다.
  lookback_hours: 14
  # 텔레그램 메시지에 섹션당 최대 몇 건까지 넣을지 (마크다운 파일에는 전부 저장됨)
  telegram_max_per_section: 8

# 영문 제목 번역(DeepL Free, 월 50만 자). 국내 언론사 기사는 이미 한글이라 제외됩니다.
translation:
  # 텔레그램에 보이지 않는 항목(마크다운 보관본에만 남는 것)까지 번역할지.
  # false로 두면 사용량이 실행당 1천 자 아래로 떨어집니다.
  translate_hidden: true

  # 한도의 몇 %를 손대지 않고 남길지. 갑작스러운 항목 급증에 대비한 완충입니다.
  monthly_reserve_ratio: 0.10

  # 크론 횟수와 맞추세요. 남은 한도를 남은 실행 횟수로 나눠 실행당 예산을 정합니다.
  runs_per_day: 2

  # 사용량 조회가 실패했을 때 쓰는 보수적 상한.
  # 남은 한도를 모르는 상태에서 크게 쓰면 456(한도 소진)을 맞을 수 있습니다.
  fallback_chars_per_run: 1500

sections:
  - name: "AI·LLM 연구"
    emoji: "🤖"
    feeds:
      - type: arxiv
        label: "arXiv"
        categories: [cs.AI, cs.CL, cs.LG]
        max_items: 60
        # arXiv는 제출 마감·공지 스케줄 때문에 하루 이상 지연됩니다.
        # 주말에는 공지가 없어 월요일 아침을 커버하려면 72시간이 필요합니다.
        # (중복은 state/seen.json이 걸러주므로 창을 넓혀도 같은 논문이 두 번 오지 않습니다.)
        lookback_hours: 72
        # 아래 키워드가 제목/초록에 하나라도 있어야 채택. 비우면 전체 통과.
        keywords:
          - agent
          - LLM
          - large language model
          - retrieval
          - RAG
          - reasoning
          - fine-tun
          - multimodal
          - benchmark

  - name: "개발·테크 뉴스"
    emoji: "💻"
    feeds:
      - type: rss
        label: "Hacker News"
        url: "https://hnrss.org/frontpage"
        max_items: 10
      - type: rss
        label: "GeekNews"
        url: "https://feeds.feedburner.com/geeknews-feed"
        max_items: 10
      - type: rss
        label: "TechCrunch"
        url: "https://techcrunch.com/feed/"
        max_items: 8

  - name: "국내 뉴스"
    emoji: "📰"
    feeds:
      - type: rss
        label: "연합뉴스"
        url: "https://www.yna.co.kr/rss/news.xml"
        max_items: 10
      - type: rss
        label: "한겨레"
        url: "https://www.hani.co.kr/rss/"
        max_items: 8
      - type: rss
        label: "경향신문"
        url: "https://www.khan.co.kr/rss/rssdata/total_news.xml"
        max_items: 8
      - type: rss
        label: "매일경제"
        url: "https://www.mk.co.kr/rss/30000001/"
        max_items: 8
      - type: rss
        label: "한국경제"
        url: "https://www.hankyung.com/feed/all-news"
        max_items: 8
