name: Daily Brief

on:
  schedule:
    # 21:20 UTC = 06:20 KST. GitHub 스케줄은 부하에 따라 5~30분 밀리므로
    # 목표 도착 시각(06:30 KST)보다 10분 앞당겨 잡았습니다.
    - cron: '20 21 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '수집만 하고 저장·전송은 건너뜀'
        type: boolean
        default: false

# 기본 GITHUB_TOKEN에 커밋 권한을 줍니다(브리프 파일과 seen.json 저장용).
permissions:
  contents: write

# 스케줄과 수동 실행이 겹쳐 push가 충돌하는 것을 막습니다.
concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python scripts/collect.py

      - name: Commit brief
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # 수집 0건이면 스크립트가 일찍 끝나 디렉터리가 없을 수 있습니다.
          mkdir -p briefs state
          git add briefs state
          if git diff --staged --quiet; then
            echo "변경 사항 없음 - 커밋 생략"
            exit 0
          fi
          git commit -m "brief: $(date -u -d '+9 hours' +%Y-%m-%d)"
          # 스케줄이 밀려 다른 실행과 겹쳤을 때를 대비해 rebase 후 push
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 조용히 실패하면 브리프가 안 오는 걸 며칠 뒤에야 알게 됩니다.
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "토큰이 없어 실패 알림을 건너뜁니다"
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT=$(printf '⚠️ 모닝 브리프 수집 실패\n%s' "$RUN_URL")
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXT}" \
            > /dev/null
